{% if form.non_field_errors %}<div role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span>*</span>{% endif %}</label>{{ field }}
{% if field.errors %}<div role="alert">{{ field.errors }}</div>{% endif %}
{% if field.help_text %}<div class="account-help" id="{{ field.auto_id }}_helptext">{{ field.help_text|safe }}</div>{% endif %}
</div>
{% endfor %}
